<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Debug Tool</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 6px;
    }
    .test-section h2 {
      margin-top: 0;
      color: #666;
      font-size: 18px;
    }
    button {
      background: #d4af37;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button:hover {
      background: #c49d2e;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 4px;
      border-left: 4px solid #d4af37;
    }
    .result pre {
      margin: 0;
      overflow-x: auto;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .avatar-preview {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
    }
    .avatar-preview img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #d4af37;
    }
    .user-info {
      flex: 1;
    }
    .user-info div {
      margin-bottom: 8px;
    }
    .label {
      font-weight: 600;
      color: #666;
      display: inline-block;
      width: 100px;
    }
    .error {
      color: #c62828;
      background: #ffebee;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
    }
    .success {
      color: #2e7d32;
      background: #e8f5e9;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Avatar Debug Tool</h1>
    <p>这个工具可以帮助你诊断头像显示问题</p>

    <!-- Test 1: Check Session -->
    <div class="test-section">
      <h2>1. 检查当前用户 Session</h2>
      <button onclick="checkSession()">检查 Session</button>
      <div id="session-result"></div>
    </div>

    <!-- Test 2: Check Custom Avatar Endpoint -->
    <div class="test-section">
      <h2>2. 检查 WordPress 自定义头像端点</h2>
      <button onclick="checkCustomAvatar()">获取自定义头像</button>
      <div id="custom-avatar-result"></div>
    </div>

    <!-- Test 3: Compare -->
    <div class="test-section">
      <h2>3. 对比分析</h2>
      <button onclick="compareAll()">完整对比</button>
      <div id="compare-result"></div>
    </div>

    <!-- Test 4: Clear Cache -->
    <div class="test-section">
      <h2>4. 清除缓存</h2>
      <button onclick="clearCache()">清除浏览器缓存并重新加载</button>
      <p style="color: #666; font-size: 14px; margin-top: 10px;">
        提示：如果头像显示错误，可能是浏览器缓存了旧的头像 URL
      </p>
    </div>
  </div>

  <script>
    async function checkSession() {
      const resultDiv = document.getElementById('session-result');
      resultDiv.innerHTML = '<p>加载中...</p>';

      try {
        const response = await fetch('/api/auth/session');
        const data = await response.json();

        if (data.authenticated) {
          resultDiv.innerHTML = `
            <div class="success">✓ 已登录</div>
            <div class="avatar-preview">
              <img src="${data.user.avatar}?t=${Date.now()}" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Error&background=ff0000&color=fff'" />
              <div class="user-info">
                <div><span class="label">用户 ID:</span> ${data.user.id}</div>
                <div><span class="label">用户名:</span> ${data.user.username}</div>
                <div><span class="label">邮箱:</span> ${data.user.email}</div>
                <div><span class="label">显示名称:</span> ${data.user.name}</div>
              </div>
            </div>
            <div class="result">
              <strong>头像 URL:</strong><br>
              <pre>${data.user.avatar}</pre>
            </div>
          `;
        } else {
          resultDiv.innerHTML = '<div class="error">✗ 未登录</div>';
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">错误: ${error.message}</div>`;
      }
    }

    async function checkCustomAvatar() {
      const resultDiv = document.getElementById('custom-avatar-result');
      resultDiv.innerHTML = '<p>加载中...</p>';

      try {
        // First get the session to get the token
        const sessionResponse = await fetch('/api/auth/session');
        const sessionData = await sessionResponse.json();

        if (!sessionData.authenticated) {
          resultDiv.innerHTML = '<div class="error">✗ 未登录，无法获取自定义头像</div>';
          return;
        }

        // Get the token from cookie (we'll need to parse it)
        const cookies = document.cookie.split(';');
        let token = null;

        for (let cookie of cookies) {
          const [name, value] = cookie.trim().split('=');
          if (name === 'woo_session') {
            try {
              const sessionToken = atob(value);
              const sessionObj = JSON.parse(sessionToken);
              token = sessionObj.token;
            } catch (e) {
              console.error('Failed to parse session cookie:', e);
            }
          }
        }

        if (!token) {
          resultDiv.innerHTML = '<div class="error">✗ 无法获取 JWT token</div>';
          return;
        }

        // Now call the WordPress custom endpoint
        const avatarResponse = await fetch('https://imanmlhijab.com/wp-json/custom/v1/get-avatar', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const avatarData = await avatarResponse.json();

        if (avatarData.success) {
          resultDiv.innerHTML = `
            <div class="success">✓ 成功获取自定义头像</div>
            <div class="avatar-preview">
              <img src="${avatarData.avatar_url}?t=${Date.now()}" alt="Custom Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Error&background=ff0000&color=fff'" />
              <div class="user-info">
                <div><span class="label">用户 ID:</span> ${avatarData.user_id}</div>
                <div><span class="label">来源:</span> ${avatarData.source === 'custom' ? '自定义上传' : '默认头像'}</div>
                ${avatarData.avatar_id ? `<div><span class="label">附件 ID:</span> ${avatarData.avatar_id}</div>` : ''}
              </div>
            </div>
            <div class="result">
              <strong>完整响应:</strong><br>
              <pre>${JSON.stringify(avatarData, null, 2)}</pre>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<div class="error">✗ 获取失败<br><pre>${JSON.stringify(avatarData, null, 2)}</pre></div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">错误: ${error.message}</div>`;
      }
    }

    async function compareAll() {
      const resultDiv = document.getElementById('compare-result');
      resultDiv.innerHTML = '<p>分析中...</p>';

      try {
        const sessionResponse = await fetch('/api/auth/session');
        const sessionData = await sessionResponse.json();

        if (!sessionData.authenticated) {
          resultDiv.innerHTML = '<div class="error">✗ 未登录</div>';
          return;
        }

        // Get token
        const cookies = document.cookie.split(';');
        let token = null;
        for (let cookie of cookies) {
          const [name, value] = cookie.trim().split('=');
          if (name === 'woo_session') {
            try {
              const sessionToken = atob(value);
              const sessionObj = JSON.parse(sessionToken);
              token = sessionObj.token;
            } catch (e) {}
          }
        }

        let wpAvatarData = null;
        if (token) {
          const avatarResponse = await fetch('https://imanmlhijab.com/wp-json/custom/v1/get-avatar', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          wpAvatarData = await avatarResponse.json();
        }

        let issues = [];

        // Check if user IDs match
        if (wpAvatarData && wpAvatarData.user_id !== sessionData.user.id) {
          issues.push(`⚠️ 用户 ID 不匹配！Session: ${sessionData.user.id}, WordPress: ${wpAvatarData.user_id}`);
        }

        // Check if avatar URLs match
        if (wpAvatarData && wpAvatarData.avatar_url !== sessionData.user.avatar) {
          issues.push(`⚠️ 头像 URL 不一致！`);
        }

        let html = '<h3>对比结果</h3>';

        if (issues.length > 0) {
          html += '<div class="error">' + issues.join('<br>') + '</div>';
        } else {
          html += '<div class="success">✓ 所有数据一致</div>';
        }

        html += `
          <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
            <tr style="background: #f5f5f5;">
              <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">数据项</th>
              <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Session API</th>
              <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">WordPress 端点</th>
            </tr>
            <tr>
              <td style="padding: 12px; border: 1px solid #ddd;">用户 ID</td>
              <td style="padding: 12px; border: 1px solid #ddd;">${sessionData.user.id}</td>
              <td style="padding: 12px; border: 1px solid #ddd;">${wpAvatarData ? wpAvatarData.user_id : 'N/A'}</td>
            </tr>
            <tr>
              <td style="padding: 12px; border: 1px solid #ddd;">头像来源</td>
              <td style="padding: 12px; border: 1px solid #ddd;">-</td>
              <td style="padding: 12px; border: 1px solid #ddd;">${wpAvatarData ? wpAvatarData.source : 'N/A'}</td>
            </tr>
            <tr>
              <td style="padding: 12px; border: 1px solid #ddd;">头像 URL</td>
              <td style="padding: 12px; border: 1px solid #ddd; word-break: break-all; font-size: 12px;">${sessionData.user.avatar}</td>
              <td style="padding: 12px; border: 1px solid #ddd; word-break: break-all; font-size: 12px;">${wpAvatarData ? wpAvatarData.avatar_url : 'N/A'}</td>
            </tr>
          </table>
        `;

        resultDiv.innerHTML = html;
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">错误: ${error.message}</div>`;
      }
    }

    function clearCache() {
      // Clear all caches and reload
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => caches.delete(name));
        });
      }

      // Force reload without cache
      window.location.reload(true);
    }
  </script>
</body>
</html>
